name: Lab 4 CI

on:
  push:
    branches: [main, dev]
    paths:
      - "lab4/**"
      - ".github/workflows/lab4.yaml"
  pull_request:
    branches: [main, dev]
    paths:
      - "lab4/**"
      - ".github/workflows/lab4.yaml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: lab4

jobs:
  lint:
    name: Style and complexity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: lab4/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: black --check .
      - run: flake8

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: lab4/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Pytest with coverage (90% threshold)
        run: pytest --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: lab4-coverage-report
          path: lab4/coverage.xml

  build:
    name: Build generic-lab4.pyz
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build.py
      - name: Smoke test the artifact
        run: echo 0 | python dist/generic-lab4.pyz
      - uses: actions/upload-artifact@v4
        with:
          name: generic-lab4
          path: lab4/dist/generic-lab4.pyz
