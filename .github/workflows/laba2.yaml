name: Lab 2 CI/CD

on:
  push:
    branches: [main, dev]
    paths:
      - "laba2/**"
      - ".github/workflows/laba2.yaml"
  pull_request:
    branches: [main, dev]
    paths:
      - "laba2/**"
      - ".github/workflows/laba2.yaml"
  workflow_dispatch:

defaults:
  run:
    working-directory: laba2

jobs:
  lint:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: flake8
        run: flake8 .

      - name: black (formatting check)
        run: black --check culinary cli main.py build.py tests

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage (fails below 90%)
        run: python -m pytest -v --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: lab2-coverage-${{ matrix.python-version }}
          path: laba2/coverage.xml

  build:
    name: Build artifact
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build executable archive
        run: python build.py

      - name: Smoke test the artifact
        run: printf '8\n0\n' | python dist/culinary-lab2.pyz

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: culinary-lab2-${{ github.sha }}
          path: laba2/dist/culinary-lab2.pyz
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lab2-build-${{ github.run_number }}
          name: "Lab 2 — build #${{ github.run_number }}"
          files: laba2/dist/culinary-lab2.pyz
          generate_release_notes: true
