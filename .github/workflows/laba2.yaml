name: Lab 2 CI/CD

on:
  push:
    branches: [main, dev]
    paths:
      - "laba2/**"
      - ".github/workflows/laba2.yaml"
  pull_request:
    branches: [main, dev]
    paths:
      - "laba2/**"
      - ".github/workflows/laba2.yaml"
  workflow_dispatch:

defaults:
  run:
    working-directory: laba2

jobs:
  lint:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: flake8
        run: flake8 .

      - name: black (formatting check)
        run: black --check culinary cli main.py build.py tests

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage (fails below 90%)
        run: python -m pytest -v --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: lab2-coverage-${{ matrix.python-version }}
          path: laba2/coverage.xml
